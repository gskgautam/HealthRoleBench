name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy==1.26.4 scipy==1.15.3 scikit-learn==1.7.2 matplotlib==3.10.7 && pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
