[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthrolebench"
version = "1.0.0"
description = "Reconstructed HealthRoleBench benchmark evaluation and reproducibility tools"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "scikit-learn==1.7.2", "matplotlib==3.10.7"]

[project.optional-dependencies]
gpu = ["torch==2.10.0", "transformers==5.8.1", "huggingface-hub==1.15.0", "sentencepiece==0.2.1", "protobuf==6.33.0"]

[tool.setuptools.packages.find]
include = ["healthrolebench*"]
